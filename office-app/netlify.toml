# Netlify site 3 of 3 — NAIM COMMAND (office app)
# In Netlify: "Base directory" = office-app
[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Required env vars (public, safe in the browser — RLS protects data):
#   VITE_SUPABASE_URL       https://<project-ref>.supabase.co
#   VITE_SUPABASE_ANON_KEY  anon public key

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"