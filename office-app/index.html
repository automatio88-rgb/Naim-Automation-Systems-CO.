<!doctype html>
<html lang="en" data-palette="gold">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#211812" />
    <title>NAIM COMMAND — Naim Automation Systems Co.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
    <script>
      // apply theme before first paint (no flash)
      try {
        var t = JSON.parse(localStorage.getItem('naim-theme') || '{}');
        var dark = t.mode === 'dark' || ((!t.mode || t.mode === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.palette = t.palette || 'gold';
        if (t.reduceMotion) document.documentElement.dataset.motion = 'reduce';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
