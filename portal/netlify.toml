# Netlify site 2 of 3 — Digital Document Portal
# In Netlify: "Base directory" = portal
[build]
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Required env vars:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   (server-side only)
# Optional:
#   SITE_URL   landing page URL, used by the brand logo link (e.g. https://naimautomations.co.ke)

[[redirects]]
  from = "/"
  to = "/docs"
  status = 302

[[redirects]]
  from = "/docs/agreement"
  to = "/docs/quotation"
  status = 301

[[redirects]]
  from = "/docs/founding-partner"
  to = "/docs"
  status = 301

[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex"